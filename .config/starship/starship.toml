"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
palette = 'nord'
continuation_prompt = "[▸▹ ](dimmed white)"

format = """
$directory\
$git_branch\
$git_status\
$git_metrics\
$fill\
$c\
$cpp\
$elixir\
$golang\
$haskell\
$java\
$julia\
$lua\
$nodejs\
$python\
$rust\
$package\
$docker_context\
$jobs\
$cmd_duration\
$line_break\
$character"""

[fill]
symbol = ' '

[character]
success_symbol = '[➜](bold green)' 
error_symbol = '[➜](bold red)'

[directory]
style = 'bold fg:dark_blue'
format = '[$path ]($style)'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false

# ----- GIT ----- 
[git_branch]
style = 'fg:green'
symbol = ' '
format = '[on](white) [$symbol$branch ]($style)'

[git_status]
style = 'fg:green'
format = '([$all_status$ahead_behind]($style) )'

[git_metrics]
disabled = false
added_style = "bold green"
deleted_style = "bold red"
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"

# ----- LANGS ----- 
[lua]
format = " [${symbol}${version}]($style)"
style = "bold yellow"
version_format = "${raw}"
symbol = ' '

[nodejs]
format = " [${symbol}($version)]($style)"
version_format = "${raw}"
style = "bold green"
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
# detect_extensions = []

[python]
format = " [${symbol}${version}]($style)"
style = "bold yellow"
symbol = "[⌉](bold bright-blue)⌊ "
version_format = "${raw}"

[rust]
format = " [$symbol$version]($style)"
version_format = "${raw}"
style = 'orange'
symbol = ' '

[package]
format = " [$symbol$version]($style)"
style = "dimmed yellow italic"
version_format = "${raw}"
symbol = '󰏗 '
# symbol = "◨ "

[aws]
disabled = true
format = " [aws](italic) [$symbol $profile $region]($style)"
style = "bold blue"
symbol = "▲ "

[buf]
symbol = "■ "
format = " [buf](italic) [$symbol $version $buf_version]($style)"

[c]
symbol = "ℂ "
format = " [$symbol($version(-$name))]($style)"

[cpp]
symbol = "ℂ "
format = " [$symbol($version(-$name))]($style)"

[elixir]
symbol = "△ "
format = " exs [$symbol $version OTP $otp_version ]($style)"

[golang]
style = 'blue'
symbol = ' '
format = " go [$symbol($version )]($style)"

[haskell]
style = 'blue'
symbol = ' '
# symbol = "❯λ "
format = " hs [$symbol($version )]($style)"

[java]
symbol = "∪ "
format = " java [${symbol}(${version} )]($style)"

[julia]
symbol = "◎ "
format = " jl [$symbol($version )]($style)"

# ----- Utilities -----
[docker_context]
symbol = "◧ "
format = " docker [$symbol$context]($style)"

[memory_usage]
symbol = "▪▫▪ "
format = " mem [${ram}( ${swap})]($style)"

[jobs]
symbol = ' '
style = 'red'
number_threshold = 1
format = '[$symbol]($style)'

[cmd_duration]
format = "[◄ $duration ](italic white)"

[palettes.nord]
dark_blue = '#5E81AC'
blue = '#81A1C1'
teal = '#88C0D0'
red = '#BF616A'
orange = '#D08770'
green = '#A3BE8C'
yellow = '#EBCB8B'
purple = '#B48EAD'
gray = '#434C5E'
black = '#2E3440'
white='#D8DEE9'

[palettes.onedark]
dark_blue='#61afef'
blue='#56b6c2'
red='#e06c75'
green='#98c379'
purple='#c678dd'
cyan='#56b6c2'
orange='#be5046'
yellow='#e5c07b'
gray='#828997'
white ='#abb2bf'
black='#2c323c'

