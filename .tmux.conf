# ==========================
# GENERAL
# ==========================
set -g default-terminal "tmux-256color"
set -sg terminal-overrides ",*:RGB"
set -g mouse on

set -g base-index 1
set-window-option -g pane-base-index 1
setw -g aggressive-resize on
set -g renumber-windows on

set -s escape-time 0
set-option -g focus-events on
set -g status-interval 5

set -g history-limit 50000
set -g display-time 4000

# ==========================
# KEYBINDINGS
# ==========================
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

unbind '"'
bind-key "'" command-prompt

# ==========================
# VIM NAVIGATION & COPY
# ==========================
set-window-option -g mode-keys vi

bind-key j select-pane -L
bind-key k select-pane -D
bind-key l select-pane -U
bind-key ';' select-pane -R

bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
bind -r m resize-pane -Z

bind-key J swap-pane -t :-
bind-key : swap-pane -t :+
bind-key K swap-pane -D
bind-key L swap-pane -U

bind-key -T copy-mode-vi j send-keys -X cursor-left
bind-key -T copy-mode-vi k send-keys -X cursor-down
bind-key -T copy-mode-vi l send-keys -X cursor-up
bind-key -T copy-mode-vi ';' send-keys -X cursor-right
bind-key -T copy-mode-vi h send-keys -X top-line 

bind-key -T copy-mode-vi 'v' send -X begin-selection 
bind-key -T copy-mode-vi 'y' send -X copy-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
unbind -T copy-mode-vi MouseDragEnd1Pane

# ==========================
# PLUGINS
# ==========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-open'

# set -g @plugin 'jimeh/tmux-themepack' 
# set -g @themepack 'powerline/block/magenta'

set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark' # or 'dark256', 'light', 'light256'

set -g @tmux-gruvbox-left-status-a '#S'
set -g @tmux-gruvbox-right-status-x '%A, %b %d'
set -g @tmux-gruvbox-right-status-y '%I:%M %p' 
set -g @tmux-gruvbox-right-status-z '#{tmux_mode_indicator}'

# set -g @tmux-gruvbox-right-status-z ' '

# set -gF @theme-status-justify 'left'
# set -gqF @theme-status-left ''
# set -gqF @theme-status-right '%A, %b %d %I:%M %p'
# set -g @themepack-window-status-format '#W'
# set -g @themepack-window-status-current-format '#W'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

